<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mes Recettes" />
  <link rel="manifest" href="manifest.json" />
  <title>Mes Recettes</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f4ef;
      --card: #ffffff;
      --text: #1a1814;
      --muted: #8a8278;
      --border: rgba(26,24,20,0.09);
      --him: #2d5a3d;
      --him-light: #eaf2ec;
      --her: #b06030;
      --her-light: #faf0e6;
      --radius: 20px;
      --radius-sm: 12px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overscroll-behavior: none; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; }
    .screen { display: none; min-height: 100vh; flex-direction: column; }
    .screen.active { display: flex; }

    .header { padding: calc(var(--safe-top) + 18px) 20px 14px; display: flex; align-items: center; justify-content: space-between; background: var(--bg); position: sticky; top: 0; z-index: 20; }
    .logo { font-family: 'DM Serif Display', serif; font-size: 26px; letter-spacing: -0.3px; }
    .logo em { font-style: italic; color: var(--him); }
    .back-btn { display: flex; align-items: center; gap: 6px; font-size: 15px; color: var(--him); background: none; border: none; cursor: pointer; padding: 4px 0; font-family: 'DM Sans', sans-serif; }

    .profile-bar { padding: 0 20px 16px; display: flex; gap: 8px; }
    .profile-btn { flex: 1; padding: 11px 10px; border-radius: 50px; border: 1.5px solid var(--border); background: var(--card); font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--muted); cursor: pointer; text-align: center; transition: all 0.2s; }
    .profile-btn.him.active { background: var(--him); border-color: var(--him); color: white; font-weight: 500; }
    .profile-btn.her.active { background: var(--her); border-color: var(--her); color: white; font-weight: 500; }

    .scroll { flex: 1; overflow-y: auto; padding: 0 20px; padding-bottom: calc(var(--safe-bottom) + 32px); }

    .profile-card { border-radius: var(--radius); padding: 18px 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 14px; }
    .profile-card.him { background: var(--him-light); }
    .profile-card.her { background: var(--her-light); }
    .avatar { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'DM Serif Display', serif; font-size: 20px; flex-shrink: 0; }
    .avatar.him { background: var(--him); color: white; }
    .avatar.her { background: var(--her); color: white; }
    .profile-name { font-size: 15px; font-weight: 500; margin-bottom: 2px; }
    .profile-detail { font-size: 13px; color: var(--muted); }
    .profile-goal { margin-top: 6px; display: inline-block; font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 50px; }
    .profile-goal.him { background: var(--him); color: white; }
    .profile-goal.her { background: var(--her); color: white; }

    .search-wrap { position: relative; margin-bottom: 14px; }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 17px; height: 17px; }
    .search-input { width: 100%; padding: 13px 16px 13px 40px; border-radius: 50px; border: 1.5px solid var(--border); background: var(--card); font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--text); outline: none; }
    .search-input::placeholder { color: var(--muted); }

    .cat-row { display: flex; gap: 8px; margin-bottom: 18px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .cat-row::-webkit-scrollbar { display: none; }
    .cat-chip { padding: 8px 15px; border-radius: 50px; white-space: nowrap; border: 1.5px solid var(--border); background: var(--card); font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--muted); cursor: pointer; flex-shrink: 0; }
    .cat-chip.him.active { background: var(--him); border-color: var(--him); color: white; }
    .cat-chip.her.active { background: var(--her); border-color: var(--her); color: white; }

    .recipes-grid { display: flex; flex-direction: column; gap: 11px; }
    .recipe-card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; display: flex; gap: 14px; align-items: flex-start; cursor: pointer; transition: transform 0.15s; }
    .recipe-card:active { transform: scale(0.98); }
    .recipe-emoji { font-size: 28px; width: 50px; height: 50px; background: var(--bg); border-radius: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .recipe-body { flex: 1; min-width: 0; }
    .recipe-name { font-size: 15px; font-weight: 500; margin-bottom: 3px; }
    .recipe-desc { font-size: 13px; color: var(--muted); margin-bottom: 8px; line-height: 1.5; }
    .recipe-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .meta-tag { font-size: 11px; padding: 3px 9px; border-radius: 50px; background: var(--bg); color: var(--muted); }
    .kcal-tag { font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 50px; }
    .kcal-tag.him { background: var(--him-light); color: var(--him); }
    .kcal-tag.her { background: var(--her-light); color: var(--her); }

    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }

    .section-lbl { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px; }

    .detail-hero { background: var(--card); border-radius: var(--radius); padding: 22px; margin-bottom: 14px; border: 1px solid var(--border); }
    .detail-emoji { font-size: 38px; margin-bottom: 10px; }
    .detail-title { font-family: 'DM Serif Display', serif; font-size: 25px; line-height: 1.2; margin-bottom: 6px; }
    .detail-desc { font-size: 14px; color: var(--muted); margin-bottom: 14px; line-height: 1.6; }
    .detail-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .detail-tag { font-size: 12px; padding: 4px 11px; border-radius: 50px; background: var(--bg); color: var(--muted); }

    .nutri-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
    .nutri-box { background: var(--bg); border-radius: var(--radius-sm); padding: 11px 6px; text-align: center; }
    .nutri-val { font-size: 17px; font-weight: 500; }
    .nutri-val.him { color: var(--him); }
    .nutri-val.her { color: var(--her); }
    .nutri-lbl { font-size: 10px; color: var(--muted); margin-top: 3px; }

    .ing-list { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; margin-bottom: 14px; }
    .ing-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 18px; border-bottom: 1px solid var(--border); gap: 10px; }
    .ing-row:last-child { border-bottom: none; }
    .ing-name { font-size: 14px; }
    .ing-qty { font-size: 13px; font-weight: 500; padding: 4px 13px; border-radius: 50px; white-space: nowrap; flex-shrink: 0; }
    .ing-qty.him { background: var(--him-light); color: var(--him); }
    .ing-qty.her { background: var(--her-light); color: var(--her); }

    .steps-list { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 18px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 15px; }
    .step-row { display: flex; gap: 13px; align-items: flex-start; }
    .step-num { width: 27px; height: 27px; border-radius: 50%; font-size: 12px; font-weight: 500; color: white; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
    .step-num.him { background: var(--him); }
    .step-num.her { background: var(--her); }
    .step-text { font-size: 14px; line-height: 1.65; }

    .conseil-box { border-radius: var(--radius); padding: 18px; margin-bottom: 14px; }
    .conseil-box.him { background: var(--him-light); }
    .conseil-box.her { background: var(--her-light); }
    .conseil-top { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
    .conseil-top.him { color: var(--him); }
    .conseil-top.her { color: var(--her); }
    .conseil-txt { font-size: 13px; color: var(--muted); line-height: 1.6; }
  </style>
</head>
<body>

<!-- SCREEN : LISTE -->
<div class="screen active" id="screen-list">
  <div class="header">
    <div class="logo">Mes <em>Recettes</em></div>
  </div>
  <div class="profile-bar">
    <button class="profile-btn him active" id="btn-him" onclick="setProfile('him')">👨 Lui</button>
    <button class="profile-btn her" id="btn-her" onclick="setProfile('her')">👩 Elle</button>
  </div>
  <div class="scroll">
    <div class="profile-card him" id="card-him">
      <div class="avatar him">H</div>
      <div>
        <div class="profile-name">Homme · 25 ans</div>
        <div class="profile-detail">90 kg · 1m80 · Modérément actif</div>
        <span class="profile-goal him">Objectif : 75–80 kg</span>
      </div>
    </div>
    <div class="profile-card her" id="card-her" style="display:none">
      <div class="avatar her">F</div>
      <div>
        <div class="profile-name">Femme · 25 ans</div>
        <div class="profile-detail">65 kg · 1m54 · Modérément active</div>
        <span class="profile-goal her">Objectif : 55 kg</span>
      </div>
    </div>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" id="search-input" type="search" placeholder="Rechercher une recette…" oninput="renderList()" />
    </div>

    <div class="cat-row" id="cat-row"></div>
    <div class="recipes-grid" id="recipes-grid"></div>
  </div>
</div>

<!-- SCREEN : DÉTAIL -->
<div class="screen" id="screen-detail">
  <div class="header">
    <button class="back-btn" onclick="goBack()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      Recettes
    </button>
  </div>
  <div class="scroll" id="detail-scroll">
    <div id="detail-content"></div>
  </div>
</div>

<script>
const CATS = { tous:'Tous', 'petit-dej':'🌅 Petit-déj', dejeuner:'☀️ Déjeuner', diner:'🌙 Dîner', snack:'🍎 Snack' };
let profile = 'him';
let cat = 'tous';
let recipes = [];

async function init() {
  try {
    const r = await fetch('recettes.json');
    recipes = await r.json();
  } catch(e) { recipes = []; }
  renderCats();
  renderList();
}

function setProfile(p) {
  profile = p;
  document.getElementById('btn-him').className = 'profile-btn him' + (p==='him'?' active':'');
  document.getElementById('btn-her').className = 'profile-btn her' + (p==='her'?' active':'');
  document.getElementById('card-him').style.display = p==='him'?'flex':'none';
  document.getElementById('card-her').style.display = p==='her'?'flex':'none';
  renderCats(); renderList();
}

function renderCats() {
  document.getElementById('cat-row').innerHTML = Object.entries(CATS).map(([k,v]) =>
    `<button class="cat-chip ${cat===k?profile+' active':''}" onclick="setCat('${k}')">${v}</button>`
  ).join('');
}

function setCat(c) { cat=c; renderCats(); renderList(); }

function renderList() {
  const q = (document.getElementById('search-input').value||'').toLowerCase();
  const list = recipes.filter(r =>
    (cat==='tous'||r.categorie===cat) &&
    (!q||r.nom.toLowerCase().includes(q)||(r.description||'').toLowerCase().includes(q))
  );
  const grid = document.getElementById('recipes-grid');
  if (!list.length) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">🍽️</div><div>Aucune recette trouvée</div></div>`;
    return;
  }
  grid.innerHTML = list.map(r => {
    const d = r[profile];
    return `<div class="recipe-card" onclick="openRecipe(${r.id})">
      <div class="recipe-emoji">${r.emoji}</div>
      <div class="recipe-body">
        <div class="recipe-name">${r.nom}</div>
        <div class="recipe-desc">${r.description}</div>
        <div class="recipe-meta">
          <span class="meta-tag">⏱ ${r.duree}</span>
          <span class="meta-tag">${r.difficulte}</span>
          <span class="kcal-tag ${profile}">${d.kcal} kcal</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function openRecipe(id) {
  const r = recipes.find(x=>x.id===id);
  if (!r) return;
  const d = r[profile];
  const p = profile;
  const lbl = p==='him'?'Lui':'Elle';

  document.getElementById('detail-content').innerHTML = `
    <div style="padding:0 20px;padding-bottom:calc(env(safe-area-inset-bottom,0px)+32px)">
      <div class="detail-hero">
        <div class="detail-emoji">${r.emoji}</div>
        <div class="detail-title">${r.nom}</div>
        <div class="detail-desc">${r.description}</div>
        <div class="detail-tags">
          <span class="detail-tag">⏱ ${r.duree}</span>
          <span class="detail-tag">${r.difficulte}</span>
          ${(r.tags||[]).map(t=>`<span class="detail-tag">${t}</span>`).join('')}
        </div>
        <div class="section-lbl">Nutrition · ${lbl}</div>
        <div class="nutri-row">
          <div class="nutri-box"><div class="nutri-val ${p}">${d.kcal}</div><div class="nutri-lbl">kcal</div></div>
          <div class="nutri-box"><div class="nutri-val ${p}">${d.proteines_g}g</div><div class="nutri-lbl">Protéines</div></div>
          <div class="nutri-box"><div class="nutri-val ${p}">${d.glucides_g}g</div><div class="nutri-lbl">Glucides</div></div>
          <div class="nutri-box"><div class="nutri-val ${p}">${d.lipides_g}g</div><div class="nutri-lbl">Lipides</div></div>
        </div>
      </div>

      <div class="section-lbl">Ingrédients · ${lbl}</div>
      <div class="ing-list">
        ${d.ingredients.map(i=>`<div class="ing-row"><span class="ing-name">${i.nom}</span><span class="ing-qty ${p}">${i.quantite} ${i.unite}</span></div>`).join('')}
      </div>

      <div class="section-lbl">Préparation</div>
      <div class="steps-list">
        ${r.etapes.map((s,i)=>`<div class="step-row"><div class="step-num ${p}">${i+1}</div><div class="step-text">${s}</div></div>`).join('')}
      </div>

      ${r.conseil?`<div class="conseil-box ${p}"><div class="conseil-top ${p}">💡 Conseil du chef</div><div class="conseil-txt">${r.conseil}</div></div>`:''}
    </div>`;

  document.getElementById('screen-list').classList.remove('active');
  document.getElementById('screen-detail').classList.add('active');
  document.getElementById('detail-scroll').scrollTop = 0;
}

function goBack() {
  document.getElementById('screen-detail').classList.remove('active');
  document.getElementById('screen-list').classList.add('active');
}

init();
</script>
</body>
</html>
